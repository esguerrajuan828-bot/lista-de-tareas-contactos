<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Contactos</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <main class="contenedor">
        <h1>Lista de Contactos</h1>

        <!-- Símbolo de usuario igual a la imagen -->
        <div class="caja-icono">
            <div class="circulo-gris">
                <div class="cabeza"></div>
                <div class="cuerpo"></div>
            </div>
        </div>

        <!-- Formulario en español -->
        <div class="formulario">
            <input type="text" id="nombre" placeholder="Ingresa tu nombre" />
            <input type="text" id="apellido" placeholder="Ingresa tu apellido" />
            <input type="text" id="telefono" placeholder="Ingresa tu teléfono" />
            <input type="text" id="ciudad" placeholder="Ingresa tu ciudad" />
            <input type="text" id="direccion" placeholder="Ingresa tu dirección" />

            <div class="radios">
                <label>
                    <input type="radio" name="genero" id="radioFemale" value="female" checked /> Femenino
                </label>
                <label>
                    <input type="radio" name="genero" id="radioMale" value="male" /> Masculino
                </label>
            </div>

            <button id="btnAgregar">AGREGAR</button>
        </div>

        <!-- Lista donde aparecerán los contactos -->
        <ul id="listaContactos"></ul>
    </main>

    <script src="script.js"></script>
</body>

</html>
